plugins { id 'com.android.application' }

android {
    namespace 'com.ollie.netcrawler'
    compileSdk 34

    defaultConfig {
        applicationId "com.ollie.netcrawler"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
