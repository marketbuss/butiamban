name: gadgetforge — frida-gadget apk patcher v2

on:
  push:
    branches:
      - claude/ollie-bench-deployment-u4k02l
    paths:
      - 'gadgetforge/input/**.apk'
      - 'gadgetforge/scripts/**.js'
      - 'gadgetforge/presets/**'
      - '.github/workflows/gadgetforge.yml'
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL to download target apk from (ignored if gadgetforge/input/ holds one)"
        required: false
        type: string
      preset:
        description: "mod preset baked into mod.js: safe-public | friends-only | solo-godmode"
        required: false
        default: "friends-only"
        type: choice
        options: [safe-public, friends-only, solo-godmode]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: set up android sdk + build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: install apktool (recent) from github release
        run: |
          mkdir -p "$HOME/.local/bin"
          APKTOOL_V=2.9.3
          curl -sSL -o "$HOME/.local/bin/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_V}/apktool_${APKTOOL_V}.jar"
          curl -sSL -o "$HOME/.local/bin/apktool" \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool"
          chmod +x "$HOME/.local/bin/apktool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/apktool" --version

      - name: install objection + frida-tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install objection frida-tools
          objection --help | head -3

      - name: install Il2CppDumper (optional, for auto-dump)
        continue-on-error: true
        run: |
          mkdir -p "$HOME/il2cppdumper"
          set +e
          # resolve latest Il2CppDumper release asset dynamically
          ASSET_URL=$(curl -sS "https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest" \
            | python3 -c "import sys,json; r=json.load(sys.stdin);
          for a in r.get('assets', []):
              if 'net8' in a['name'] or 'net6' in a['name']:
                  print(a['browser_download_url']); break")
          echo "il2cppdumper asset: $ASSET_URL"
          if [ -n "$ASSET_URL" ]; then
            curl -sSL -o /tmp/il2.zip "$ASSET_URL" && unzip -o /tmp/il2.zip -d "$HOME/il2cppdumper" || true
            ls "$HOME/il2cppdumper" || true
          fi
          # try installing dotnet so we can actually run it
          sudo apt-get update -qq || true
          sudo apt-get install -y dotnet-runtime-8.0 2>/dev/null \
            || sudo apt-get install -y dotnet-runtime-6.0 2>/dev/null \
            || echo "dotnet runtime unavailable — il2cpp dump will be skipped"
          exit 0

      - name: fetch latest frida-gadget arm64
        id: gadget
        run: |
          mkdir -p gadgetforge/work
          V=$(curl -sS https://api.github.com/repos/frida/frida/releases/latest \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "frida version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          URL="https://github.com/frida/frida/releases/download/${V}/frida-gadget-${V}-android-arm64.so.xz"
          curl -sSL -o gadgetforge/work/libfrida-gadget.so.xz "$URL"
          xz -d gadgetforge/work/libfrida-gadget.so.xz
          ls -la gadgetforge/work/libfrida-gadget.so

      - name: pick target apk
        id: pick
        run: |
          mkdir -p gadgetforge/work
          APK=""
          BASENAME="target"
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            curl -sSL -o gadgetforge/work/target.apk "${{ github.event.inputs.apk_url }}"
            APK="gadgetforge/work/target.apk"
          else
            FOUND=$(ls gadgetforge/input/*.apk 2>/dev/null | head -1)
            if [ -z "$FOUND" ]; then
              echo "no input apk found; nothing to patch"
              exit 1
            fi
            cp "$FOUND" gadgetforge/work/target.apk
            APK="gadgetforge/work/target.apk"
            BASENAME="$(basename "$FOUND" .apk)"
          fi
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "sha_in=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: auto il2cpp dump (if Unity apk)
        id: il2
        continue-on-error: true
        run: |
          cd gadgetforge/work
          mkdir -p il2
          unzip -q target.apk -d il2unzip
          IL2SO=$(find il2unzip -name "libil2cpp.so" | head -1)
          META=$(find il2unzip -name "global-metadata.dat" | head -1)
          if [ -z "$IL2SO" ] || [ -z "$META" ]; then
            echo "not a Unity il2cpp apk — skipping dump"
            echo "offsets={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "il2cpp detected: $IL2SO + $META"
          cp "$IL2SO" il2/libil2cpp.so
          cp "$META" il2/global-metadata.dat
          cd il2
          cat > config.json <<'JSON'
          {
            "ForceDump": false,
            "NoRedirectedPointer": false,
            "DumpMethod": true,
            "DumpField": true,
            "DumpProperty": false,
            "DumpAttribute": false,
            "DumpFieldOffset": true,
            "DumpMethodOffset": true,
            "DumpTypeDefIndex": false,
            "GenerateDummyDll": false,
            "GenerateScript": false,
            "RequireAnyKey": false
          }
          JSON
          # try dotnet + Il2CppDumper.dll, fallback to skipping
          if command -v dotnet >/dev/null && [ -f "$HOME/il2cppdumper/Il2CppDumper.dll" ]; then
            dotnet "$HOME/il2cppdumper/Il2CppDumper.dll" libil2cpp.so global-metadata.dat . || true
          else
            echo "il2cpp dumper not available — skipping offset dump"
          fi
          ls -la || true
          if [ -f dump.cs ]; then
            python3 - <<'PY' > ../il2_offsets.json
          import re, json, pathlib
          dump = pathlib.Path("dump.cs").read_text(errors="ignore")
          # look for well-known game-mod symbols
          wanted = {
            "PlayerMovement_FixedUpdate": r"PlayerMovement\.FixedUpdate.*?RVA:\s*0x([0-9A-Fa-f]+)",
            "PlayerMovement_Update":      r"PlayerMovement\.Update\b.*?RVA:\s*0x([0-9A-Fa-f]+)",
            "Economy_SetMoney":           r"Economy\.(?:SetMoney|AddMoney|Set).*?RVA:\s*0x([0-9A-Fa-f]+)",
            "Player_TakeDamage":          r"(?:Player|PlayerHealth)\.(?:TakeDamage|OnDamage|Damage).*?RVA:\s*0x([0-9A-Fa-f]+)",
            "Camera_Render":              r"Camera\.Render\b.*?RVA:\s*0x([0-9A-Fa-f]+)",
            "GameNet_SendPacket":         r"(?:NetworkManager|GameNet|Rpc)\.(?:Send|SendPacket|RpcSend).*?RVA:\s*0x([0-9A-Fa-f]+)",
            "Stamina_Decrement":          r"Stamina\.(?:Decrement|Consume|Drain).*?RVA:\s*0x([0-9A-Fa-f]+)",
          }
          out = {}
          for name, pat in wanted.items():
            m = re.search(pat, dump, re.DOTALL)
            if m: out[name] = "0x" + m.group(1).upper()
          print(json.dumps(out))
          PY
            echo "offsets=$(cat ../il2_offsets.json)" >> "$GITHUB_OUTPUT"
            echo "il2cpp offsets:"
            cat ../il2_offsets.json
          fi

      - name: generate debug keystore
        run: |
          cd gadgetforge/work
          keytool -genkey -v -keystore debug.ks -storepass android -alias androiddebugkey \
                  -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=gadgetforge, OU=ollie, O=olivia, L=bench, S=hum, C=XX" \
                  -noprompt

      - name: prepare mod.js (preset + offsets injected)
        run: |
          cd gadgetforge/work
          cp ../scripts/mod.js mod.base.js
          PRESET='${{ github.event.inputs.preset || 'friends-only' }}'
          OFFSETS='${{ steps.il2.outputs.offsets || '{}' }}'
          echo "preset: $PRESET"
          echo "offsets: $OFFSETS"
          python3 - <<PY > mod.js
          preset = "$PRESET"
          import json
          offs = json.loads(r'''$OFFSETS''' or "{}")
          head = f"""// gadgetforge mod.js — generated {preset} preset
          const GADGETFORGE_PRESET = "{preset}";
          const GADGETFORGE_OFFSETS = {json.dumps(offs, indent=2)};
          """
          print(head)
          print(open("mod.base.js").read())
          PY
          head -5 mod.js
          wc -l mod.js

      - name: patch apk with objection
        id: objpatch
        continue-on-error: true
        run: |
          cd gadgetforge/work
          objection patchapk \
            --source target.apk \
            --architecture arm64 \
            --gadget-source libfrida-gadget.so \
            --skip-resources \
            --script mod.js
          ls -la target.objection.apk && mv target.objection.apk patched.unsigned.apk

      - name: manual fallback patch
        if: steps.objpatch.outcome == 'failure'
        run: |
          cd gadgetforge/work
          echo "objection path failed — manual injection via apktool"
          rm -rf decoded
          apktool d -f -o decoded target.apk

          # drop the gadget .so into arm64 (plus armeabi-v7a if present)
          mkdir -p decoded/lib/arm64-v8a
          cp libfrida-gadget.so decoded/lib/arm64-v8a/libfrida-gadget.so

          # ship mod.js + config next to the gadget .so so gadget auto-loads it
          # (android only extracts lib*.so from apks — hence the .so suffix hack)
          cp mod.js decoded/lib/arm64-v8a/libfrida-gadget.script.so
          cat > decoded/lib/arm64-v8a/libfrida-gadget.config.so <<'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "./libfrida-gadget.script.so",
              "on_change": "reload"
            }
          }
          EOF

          LAUNCH=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = "{http://schemas.android.com/apk/res/android}"
          t = ET.parse("decoded/AndroidManifest.xml").getroot()
          pkg = t.get("package", "")
          # prefer Application subclass if there is one
          for app in t.findall("application"):
              appname = app.get(ns+"name")
              if appname:
                  if appname.startswith("."): appname = pkg + appname
                  elif "." not in appname: appname = pkg + "." + appname
                  if appname and appname != "android.app.Application":
                      print(appname)
                      raise SystemExit
          # else: launcher activity
          for app in t.findall("application"):
              for act in app.findall("activity"):
                  for intf in act.findall("intent-filter"):
                      has_main = any(a.get(ns+"name")=="android.intent.action.MAIN" for a in intf.findall("action"))
                      has_launch = any(c.get(ns+"name")=="android.intent.category.LAUNCHER" for c in intf.findall("category"))
                      if has_main and has_launch:
                          name = act.get(ns+"name") or ""
                          if name.startswith("."): name = pkg + name
                          elif "." not in name: name = pkg + "." + name
                          print(name)
                          raise SystemExit
          PY
          )
          echo "injection target: $LAUNCH"
          SMALI_PATH=$(find decoded -path "*/$(echo $LAUNCH | tr '.' '/').smali" | head -1)
          echo "smali path: $SMALI_PATH"
          [ -z "$SMALI_PATH" ] && { echo "could not find smali for $LAUNCH"; exit 1; }

          python3 - "$SMALI_PATH" <<'PY'
          import sys, re, pathlib
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          injection = (
              "    const-string v0, \"frida-gadget\"\n"
              "    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n"
          )
          m = re.search(r"\.method static constructor <clinit>\(\)V\n(?:\s*\.locals \d+\n)?", src)
          if m:
              i = m.end()
              out = src[:i] + injection + src[i:]
          else:
              clinit = (
                  "\n.method static constructor <clinit>()V\n"
                  "    .locals 1\n"
                  + injection +
                  "    return-void\n"
                  ".end method\n"
              )
              out = src.rstrip() + clinit
          p.write_text(out)
          print("patched clinit")
          PY

          # make sure INTERNET + storage perms are present
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("decoded/AndroidManifest.xml")
          s = p.read_text()
          needed = [
            "android.permission.INTERNET",
            "android.permission.READ_EXTERNAL_STORAGE",
          ]
          added = False
          for perm in needed:
              if perm not in s:
                  s = re.sub(r"(<manifest[^>]*>)",
                      rf"\1\n    <uses-permission android:name=\"{perm}\"/>",
                      s, count=1)
                  added = True
          if added:
              p.write_text(s)
              print("added perms")
          PY

          apktool b decoded -o patched.unsigned.apk
          ls -la patched.unsigned.apk

      - name: zipalign + sign
        run: |
          cd gadgetforge/work
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -v -p 4 patched.unsigned.apk patched.aligned.apk
          "$BT/apksigner" sign \
            --ks debug.ks --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out target.gadget.apk patched.aligned.apk
          "$BT/apksigner" verify --verbose target.gadget.apk
          sha256sum target.gadget.apk

      - name: build info
        id: info
        run: |
          cd gadgetforge/work
          {
            echo "preset: ${{ github.event.inputs.preset || 'friends-only' }}"
            echo "frida: ${{ steps.gadget.outputs.version }}"
            echo "source sha256: ${{ steps.pick.outputs.sha_in }}"
            echo "patched sha256: $(sha256sum target.gadget.apk | awk '{print $1}')"
            echo "patched size: $(stat -c %s target.gadget.apk) bytes"
            echo "built from commit: ${GITHUB_SHA}"
            echo "built at: $(date -u +%FT%TZ)"
            echo "il2cpp offsets found:"
            echo '${{ steps.il2.outputs.offsets }}' | python3 -m json.tool || echo "n/a"
            echo "objection path: ${{ steps.objpatch.outcome }}"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: upload patched apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadget-patched-apk
          path: |
            gadgetforge/work/target.gadget.apk
            gadgetforge/work/BUILD_INFO.txt
            gadgetforge/work/mod.js
          retention-days: 30

      - name: push patched apk to apk-builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASENAME="${{ steps.pick.outputs.basename }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin apk-builds || true
          if git ls-remote --heads origin apk-builds | grep -q apk-builds; then
            git checkout -B apk-builds origin/apk-builds
          else
            git checkout --orphan apk-builds
            git rm -rf . --quiet 2>/dev/null || true
          fi
          mkdir -p build/gadgetforge
          cp /home/runner/work/butiamban/butiamban/gadgetforge/work/target.gadget.apk  "build/gadgetforge/${BASENAME}.gadget.apk"
          cp /home/runner/work/butiamban/butiamban/gadgetforge/work/BUILD_INFO.txt     "build/gadgetforge/${BASENAME}.BUILD_INFO.txt"
          cp /home/runner/work/butiamban/butiamban/gadgetforge/work/mod.js             "build/gadgetforge/${BASENAME}.mod.js"
          sha256sum "build/gadgetforge/${BASENAME}.gadget.apk" > "build/gadgetforge/${BASENAME}.gadget.apk.sha256"
          git add build/
          git commit -m "gadgetforge: ${BASENAME} patched @ ${GITHUB_SHA::7} (${{ github.event.inputs.preset || 'friends-only' }})" || echo "nothing to commit"
          git push --force origin apk-builds
