name: build netcrawler apk

on:
  push:
    branches:
      - claude/ollie-bench-deployment-u4k02l
    paths:
      - 'netcrawler/**'
      - '.github/workflows/build-netcrawler-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: set up android sdk
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: gradle wrapper
        working-directory: netcrawler
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: build debug apk
        working-directory: netcrawler
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: stage apk file
        run: |
          mkdir -p apk-build
          cp netcrawler/app/build/outputs/apk/debug/app-debug.apk apk-build/netcrawler-debug.apk
          sha256sum apk-build/netcrawler-debug.apk > apk-build/netcrawler-debug.apk.sha256
          ls -la apk-build/

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcrawler-apk
          path: apk-build/netcrawler-debug.apk
          retention-days: 30

      - name: commit apk to apk-builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fresh orphan branch each build so we never grow history
          git checkout --orphan apk-builds
          git rm -rf . --quiet || true
          mkdir -p build
          cp /home/runner/work/butiamban/butiamban/apk-build/netcrawler-debug.apk build/
          cp /home/runner/work/butiamban/butiamban/apk-build/netcrawler-debug.apk.sha256 build/
          echo "built from commit ${GITHUB_SHA}" > build/BUILD_INFO.txt
          echo "built at $(date -u +%FT%TZ)" >> build/BUILD_INFO.txt
          git add build/
          git commit -m "apk build @ ${GITHUB_SHA::7}"
          git push --force origin apk-builds
